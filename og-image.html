<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OG Image - Isabel Bakhshi | 1200×630</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Sans+3:wghhot@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow: hidden; }
        body {
            width: 1200px;
            height: 630px;
            background-color: #fafaf9;
            position: relative;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 80px;
            height: 100%;
        }
        .name {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 120px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            color: #6366f1;
        }
        .dotted-i {
            position: relative;
            display: inline-block;
            color: #6366f1;
        }
        .dotted-i::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background-color: #6366f1;
            border-radius: 50%;
            top: -0.05em;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }
        .tagline {
            font-family: 'Instrument Serif', Georgia, serif;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.25;
            letter-spacing: -0.02em;
            color: #3a3245;
            margin: 24px 0 0 0;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="name">ISABEL BAKHSH<span class="dotted-i">I</span></h1>
        <p class="tagline">Designing clarity for the systems we use every day—like Tap to Pay.</p>
    </div>
</body>
</html>
